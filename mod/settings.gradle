pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = "mccli"

include 'fabric'
include 'fabric-1.21.4'
include 'neoforge'

// Minecraft 26.x (unobfuscated, Java 25). Loader-independent code lives in common-26/
// and is added as a source directory to both subprojects.
include 'fabric-26'
include 'neoforge-26'
